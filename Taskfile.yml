version: '3'

# Spinbox's colors, type, layout and mark: palette.toml and assets/mark.png are the sources, and
# dist/ and logos/ are what they make, committed, for the website, the dashboard and anything else
# that draws Spinbox to copy. `task check` holds them to the sources.

# versions, bump, release, lint:workflows and consumers are go-tools' (its
# internal/tasks/tasks.yml), as in every spin-stack repository; `go tool task` names the file.
# This task cuts brand's releases: pages.yml's pass is the proof, and Gate the job it must have run.
includes:
  common:
    taskfile: '{{.GO_TOOLS_TASKS}}'
    flatten: true
    vars:
      RELEASE:
        map: {proof: pages.yml, jobs: Gate}

tasks:
  default:
    cmds:
      - task: palette
      - task: mark

  palette:
    desc: Check every pair palette.toml carries (contrast; CIEDE2000 as drawn, on panels and through each colour-vision deficiency) and write dist/.
    cmds:
      - go run ./cmd/palette

  report:
    desc: Print every pair with its contrast or its distance in each view.
    cmds:
      - go run ./cmd/palette -report

  mark:
    desc: Cut the stack of disks out of assets/mark.png, the mark as drawn, into logos/ at each size - reduced, never enlarged.
    cmds:
      - go run ./cmd/mark

  screens:
    desc: Keep every screen of the app from SCREENS=, where `CATALOG_SHOTS=<dir> task e2e:dashboard -- catalog.spec.ts` in a spin checkout (SPIN=, by default ../spin) wrote them - the catalog and the audit in screens/, the images on a release of this repository.
    vars:
      SPIN: '{{.SPIN | default "../spin"}}'
    cmds:
      - go run ./cmd/screens -spin {{.SPIN}} -from {{.SCREENS}}

  preview:
    desc: Serve index.html, the laboratory - the site, the dashboard and a phone's width in the palette, in either mode and through each deficiency - at http://127.0.0.1:4330/
    cmds:
      - python3 -m http.server 4330 --bind 127.0.0.1

  agent-client:
    desc: Read the names of the variables the agent client declares - apps/web/src/index.css of spin-stack/t3code, in the checkout T3CODE= at REF= (by default fork/spin) - into cmd/palette/testdata/t3code.vars, the names dist/t3code.css is held to. Run when the fork moves - a name it dropped then fails `task check`.
    requires:
      vars: [T3CODE]
    vars:
      REF: '{{.REF | default "fork/spin"}}'
    cmds:
      - |
        set -eu -o pipefail
        commit="$(git -C {{.T3CODE}} rev-parse --verify '{{.REF}}^{commit}')"
        names="$(git -C {{.T3CODE}} show "$commit:apps/web/src/index.css" | grep -oE '^\s*--[a-zA-Z0-9-]+:' | tr -d ' \t:' | LC_ALL=C sort -u)"
        {
          echo '# Every custom property spin-stack/t3code declares in apps/web/src/index.css, the agent'
          echo "# client's theme, at the commit below. Written by \`go tool task agent-client\`: edit nothing."
          echo "# commit $commit"
          echo "$names"
        } > cmd/palette/testdata/t3code.vars

  check:
    desc: What CI runs - fail if a pair is below its floor, dist/ or logos/ is not what the sources make, a workflow step is not one task, a workflow does not lint or uses an action by a tag, or an install skips Socket Firewall.
    cmds:
      # The Task running this one, which taskgate asks for the task names. go-tools' commands are on
      # its PATH: `go tool task` (go-tools' cmd/task) runs the Task go-tools pins with them.
      - taskgate -common -task {{.TASK_EXE}}
      - task: lint:workflows
      - sfw check
      - go vet ./...
      - go test ./...
      - go run ./cmd/palette -check
      - go run ./cmd/mark -check
      - go run ./cmd/screens -check

  screens:download:
    desc: Unpack the screens' images into screens/img from the release screens/screens.json names - they are not in git, and the published page serves them from there.
    cmds:
      - mkdir -p screens/img
      # GITHUB_REPOSITORY is set in CI; outside it, this repository.
      - gh release download "$(jq -r .tag screens/screens.json)" --repo "${GITHUB_REPOSITORY:-spin-stack/brand}" --pattern screens.tar.gz --output - | tar -xz -C screens/img
