name: Pages

# Checks the palette, the mark and the screenshots against their sources on every push and pull request, and
# publishes main to GitHub Pages: index.html with dist/, logos/, fonts/ and assets/ beside it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The check main's ruleset requires, named Gate in every spin-stack repository.
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # What a developer runs, with the Task go.mod pins.
      - run: go tool task check
      # The screens' images are not in git: screens.json names the release that holds them, and
      # the page serves them from screens/img.
      - if: github.ref == 'refs/heads/main' && hashFiles('screens/screens.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: go tool task screens:download
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
