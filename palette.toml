# The colors, type and layout of Spinbox: the one place they are written. `task palette` checks
# every pair that carries meaning (contrast, perceptual distance as drawn and under colour-vision
# deficiencies, on a lit IPS panel and a dimmed one) and writes them out in dist/ for each place
# that draws Spinbox: the website (Starlight), the dashboard (Tailwind, shadcn's variables), the
# terminal page, and anything else that reads dist/tokens.json. THEMING.md says where each goes.
#
# The colors come from the spin-stack mark: a stack of disks - the layers a workspace's disk is
# made of - in cyan and blue on navy, with a mint ring. The interface is navy ink with the cyan,
# deepened, as its one accent, used sparingly. A royal blue in its place read as any SaaS; navy and
# cyan are what read as Spinbox. Dark is the default.

[brand]
navy = "#111827"   # the mark's ground, as the avatar and the favicon's tile have it; not a surface
cyan = "#27BFE8"   # the mark's middle disk; the accent is this cyan, deepened until white reads on it
blue = "#2F6BE3"   # the mark's lower disk; drawings only
deep = "#0C3C84"   # the mark's base; drawings only
mint = "#5FE3D6"   # the ring; drawings only (an eyebrow in mint competed with every state
                   # in a drawing), never a surface
frost = "#EAF0F6"  # the mark's top disk; text on navy

# Surfaces, darkest to lightest in dark mode and lightest to darkest in light: page (behind
# everything), surface (navigation and sidebars, a step off the page), raised (cards, code,
# inputs), overlay (menus, dialogs). Dark is the mark's navy at its own chroma, a step under the
# avatar's (#0E1421, L 9%), each step a clear lightness apart (the edge floor). A darker ink
# (#0A0E16) read as near-black on the website: the navy was gone with the glare. The navy the dark page was before (#111827 to #273552 in steps of 4%) blended its planes,
# and its blue-grey borders were louder than they were; the hue was never the problem.
[dark]
page = "#0E1421"
surface = "#161E2F"
raised = "#1F2940"
overlay = "#2A3550"
border = "#34405A"      # a line between two surfaces, and an input's edge: 3:1 is held on page
border_strong = "#6B7894" # an input's edge where it must read as a control (WCAG 1.4.11)
text = "#E6EBF2"
muted = "#9AA5B8"       # secondary text: held to 4.5:1 on every surface up to overlay
accent = "#1B7DB4"      # the one primary action per view, solid; indicators; the focus ring
accent_text = "#6CC6EE" # links and labels in the accent
on_accent = "#FFFFFF"   # text on the solid accent
label = "#8FB3C6"       # a slate: a small label that names a section, quieter than a state
success = "#4CC38A"
warning = "#E3B04B"
error = "#EE7BB0"       # leans pink to magenta: a deutan tells it from success by its blue
destructive = "#C4384F" # the fill of a destructive action, its label white

[light]
page = "#FFFFFF"
surface = "#F1F4F9"
raised = "#E1E7F0"
overlay = "#FFFFFF"
border = "#C4CCD8"
border_strong = "#77829A"
text = "#111827"
muted = "#525D72"
accent = "#0A6FA3"      # the cyan darkened until white text on it, and it on white, read
accent_text = "#075A86"
on_accent = "#FFFFFF"
label = "#33586E"       # the slate, darkened to read on white
success = "#0F6844"
warning = "#845000"
error = "#9A1F60"       # magenta-leaning, as dark's: a deutan tells it from success by its blue
destructive = "#C0303F"

# A terminal - the workspace's shell, an agent's console, a machine's boot log - is black in either
# theme: a console on the page's white read as a document, not a shell (2026-11-08). Its own roles,
# not the dark theme's: the dark page is navy, and a terminal on it would be a card, not a screen.
# The dashboard frames it with the theme's border. The sixteen ANSI colours are what a program asks
# for by number; each reads at 4.5:1 on the background (the foreground and white at 7), except
# black, which a program paints as a cell's background and the foreground reads on.
[terminal]
background = "#0A0C10"
foreground = "#E6EBF2"
cursor = "#27BFE8"         # the brand's cyan; the character under it is the background
selection = "#2C3A55"      # the foreground holds 7:1 on it
black = "#262C38"
red = "#F0707A"
green = "#4CC38A"
yellow = "#E3B04B"
blue = "#6A9FF0"
magenta = "#D58AE6"
cyan = "#27BFE8"
white = "#C9D1DE"
bright_black = "#7D889C"
bright_red = "#FF9CA4"
bright_green = "#7EE0AE"
bright_yellow = "#F5CF7A"
bright_blue = "#9CC0FF"
bright_magenta = "#EBB2F7"
bright_cyan = "#5FE3D6"
bright_white = "#FFFFFF"

# The accent over a surface, for what is selected or hovered on the site (the current page in the
# sidebar, a hovered link): an alpha, so one value serves every surface. The label on a tint is
# accent_text. The dashboard keeps the accent for its one primary action and the focus ring: its
# hover and its navigation's selection are neutral, the surface a step off the page. The scrim is
# the dark page behind a dialog, the only dim there is.
[tint]
hover = 0.10
selected = 0.27      # cyan over navy is close in hue: a stronger tint keeps a selection told apart
scrim = 0.64
# A solid fill under the pointer: black over it at this alpha, and twice it when pressed. Darker in
# both themes, since the label on the accent and on the destructive is white.
fill = 0.12
# A state's badge (running, waiting, failed): the state's colour as a tint under its own text, so a
# state reads as a thing and not as coloured words. Its text holds 4.5:1 on it over every surface.
badge = 0.12

# Elevation: what lifts a menu, a dialog or a toast off what is under it. In light, a soft shadow
# under a white plane. In dark, a shadow is black on near-black: under a scrim it drew a darker
# rectangle around the dialog that read as a second, smaller overlay. There the plane's own
# lightness (overlay) and its border lift it, and the shadow is only a crisp edge.
[elevation]
light = "0 12px 32px rgb(16 19 24 / 0.14), 0 2px 6px rgb(16 19 24 / 0.08)"
dark = "0 0 0 1px rgb(0 0 0 / 0.4)"

# Type. IBM Plex, served by the site that uses it: a sans for reading and the app's headings, and a
# mono for what a machine says - commands, output, ids, an image, a state, a time - and for the
# site's headings (type.display), which set Spinbox in its console's face. A title that names a thing (a workspace, a runner) is its
# identifier, in mono. Mono beside sans is set at the sans' size, never smaller: an id or a state
# at 11 px beside a 13 px name was the least legible thing on every screen.
[type]
sans = "IBM Plex Sans"
mono = "IBM Plex Mono"
fallback_sans = "system-ui, -apple-system, 'Segoe UI', sans-serif"
fallback_mono = "ui-monospace, 'SF Mono', Menlo, monospace"
reading_size = 16       # px: the docs' body. Below 16 iOS zooms into a focused input
dense_size = 13         # px: the dashboard's body, where a table of runners is the content
# The dashboard's scale, by the names its Tailwind theme gives them: a step under Tailwind's own,
# which is sized for reading an article; set a table of runners in it and it reads as shouting.
# Each step is [size, line height] in px.
dense_scale = { xs = [12, 16], sm = [13, 20], base = [14, 22], lg = [16, 24], xl = [18, 26], "2xl" = [20, 28], "3xl" = [24, 32] }
line_height = 1.6       # reading; dense text takes 1.45
heading_weight = 600
heading_tracking = -0.02 # em: a large sans set tight reads as one word
heading = "sans"        # the face of the app's headings, and the laboratory's
# The face of the site's headings - the landing's and the docs': the mono, set tight. The website's
# blind council (November, 16 of 20 verdicts) took the mono headings as what made the site read as
# Spinbox's and not a template; what a reviewer of the laboratory read as a terminal was a 52 px
# mono with its own wide spacing. So the mono, at the display tracking, and its word gaps closed.
display = "mono"
display_tracking = -0.035
# Headings from a phone's width (layout.phone) to a desktop's (layout.desktop), [px there, px here]:
# a clamp() in between, so a title neither shouts on a phone nor whispers on a monitor.
# The display is the landing's headline alone: a page's title is h1, a step under it, so that a
# doc's title keeps its proportion to its sections (Starlight's h1 was the display, and a title
# towered over its h2s).
fluid = { display = [32, 52], h1 = [28, 40], h2 = [22, 30], h3 = [18, 22], h4 = [16, 18] }
# Figures in tables and meters line up: every digit the same width.
numeric = "tabular-nums"
# The name beside the mark, and in every header: the word the prose uses, since a lowercase mark
# beside a capitalised product was two spellings of one name. The dashboard's catalog audit holds
# its sidebar to this; the website's reference holds its title to it.
wordmark = "Spinbox"

# Layout. A measure readers keep their place in, targets fingers hit, and corners that read as
# one product from the site to the dashboard.
[layout]
measure = 72            # ch: a line of reading text; 45-75 is the range people read without losing it
sidebar = 17            # rem
radius_sm = 6           # px: inputs, chips, code; every corner of the dashboard, dialogs included
radius = 8              # px: the site's cards, buttons, panels
radius_lg = 12          # px: the site's dialogs and hero figures
target = 24             # px: the least a pointer target is (WCAG 2.2, 2.5.8)
target_touch = 44       # px: a target on a coarse pointer (WCAG 2.5.5, Apple's HIG)
phone = 390             # px: the narrow width every page is drawn at in preview.html
tablet = 768
desktop = 1280
# How wide a page grows: every page but an explorer is one column of this width, centred, so a
# page keeps its edges where the one before it had them. Three widths by what a page showed
# moved the title and the primary action between pages; the user read that as a bug
# (2026-11-08). An explorer - logs, traces - takes the viewport. The dashboard's page-width.ts
# reads this.
width_page = 1600       # px
# What a page is made of, inside that column. A section of a page is a heading, a hairline and
# its rows, on the page's own plane: a border around every section made the console a grid of
# cards (the October review). A thing with its own identity and its single action - a network
# policy, a server, an image - is a panel: a hairline edge at `radius`, its header (name, state,
# the action and its menu) on `surface`, its body on the page, no shadow, since it does not
# float. A list of many is a table, never a panel per row. Panels tile across the column, each
# at least this wide: at 1600 px two rules tables side by side, where one stretched to the
# column's width put a port 1000 px from its destination (2026-11-08). In the column a table has
# fixed tracks, so a column is at one x in every row and every panel, and a label and its value
# sit together, never split across the width.
width_panel_min = 560   # px

# Controls: a button's or an input's height, small (a row's action, a toolbar), medium (a form, a
# page's header) and large (a dialog's footer, the site); the icon in it and the gap to its word.
# 44 px on a coarse pointer is layout.target_touch. One rule for words and icons: a primary action
# is words alone; an icon goes alone, with a tooltip, where a toolbar has no room for words.
[controls]
sm = 28
md = 32
lg = 36
icon = 16
gap = 6

# Motion. A movement says what something does - a layer sealed on the one under it, a diff drawn
# between two - or that it answered a hand; one that only decorates is left out. Each runs once:
# nothing moves on its own for longer than 5 s (WCAG 2.2.2), and reduced motion asked for is
# every one at its end state.
[motion]
fast = 120              # ms: a hover, a press, a focus ring
base = 200              # ms: a card, a tab, a menu opening
slow = 400              # ms: a section coming into view
draw = 700              # ms: a line of a drawing being drawn
ease = "cubic-bezier(0.2, 0.7, 0.2, 1)" # out, quick then settling: it arrives rather than bounces
