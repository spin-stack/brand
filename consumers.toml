# Every place that draws Spinbox, and what it takes from this repository. A place not here is not a
# consumer: a new one is added here first, and `go tool task consumers` (go-tools' consumers) says
# which brand each is on. cmd/palette's tests hold this file: every path on the right of `copies`
# is one this repository has, and every output in dist/ is one somebody here copies.
#
# Of the table:
#
#   name      what a consumer's versions.yaml calls this repository
#   scope     the npm scope whose packages are this repository's to pin: the faces
#
# Of each consumer:
#
#   name      what the report calls it
#   repo      owner/name on GitHub, read at its default branch
#   pin       the versions.yaml, in that repository, whose `brand` entry names the commit it is on
#   packages  the package.json its faces are installed from: consumers install @fontsource/* from
#             npm and do not copy fonts/, so a new stylesheet beside the old packages draws in the
#             system's fallback. Absent for a consumer that sets no text of its own.
#   copies    the consumer's file = the file of this repository it is a copy of

name = "brand"
scope = "@fontsource"

[[consumer]]
name = "dashboard"
repo = "spin-stack/spin"
pin = "versions.yaml"
packages = "dashboard/package.json"
[consumer.copies]
"dashboard/src/styles/brand.css" = "dist/dashboard.css"
"dashboard/public/brand/mark-256.png" = "logos/mark-256.png"
"dashboard/public/brand/mark-clear-256.png" = "logos/mark-clear-256.png"
"dashboard/public/brand/mark-dark-256.png" = "logos/mark-dark-256.png"
"dashboard/public/brand/mark-512.png" = "logos/mark-512.png"
"dashboard/public/brand/apple-touch-icon.png" = "logos/apple-touch-icon.png"
"dashboard/public/brand/favicon-32.png" = "logos/favicon-32.png"
"dashboard/public/brand/favicon-64.png" = "logos/favicon-64.png"

# Grafana's dashboards draw their series and thresholds in tokens.json's chart colours, through the
# copy spin's control plane embeds. Grafana sets the text.
[[consumer]]
name = "grafana"
repo = "spin-stack/spin"
pin = "versions.yaml"
[consumer.copies]
"internal/controlplane/grafana/brand-tokens.json" = "dist/tokens.json"

[[consumer]]
name = "website"
repo = "spin-stack/website"
pin = "versions.yaml"
packages = "package.json"
[consumer.copies]
"src/styles/brand-tokens.css" = "dist/tokens.css"
"src/styles/brand-starlight.css" = "dist/starlight.css"
"src/assets/logo.png" = "logos/mark-dark-256.png"
"src/assets/logo-light.png" = "logos/mark-clear-256.png"
"public/mark.png" = "logos/mark-512.png"
"public/favicon.png" = "logos/favicon-64.png"
"public/apple-touch-icon.png" = "logos/apple-touch-icon.png"

[[consumer]]
name = "blog"
repo = "spin-stack/blog"
pin = "versions.yaml"
packages = "package.json"
[consumer.copies]
"src/styles/brand-tokens.css" = "dist/tokens.css"
# The scripts that draw its diagrams, cards and social images read the roles from the JSON.
"src/data/brand-tokens.json" = "dist/tokens.json"
"public/mark-dark.png" = "logos/mark-dark-256.png"
"public/mark-light.png" = "logos/mark-clear-256.png"
"public/favicon.png" = "logos/favicon-64.png"
"public/apple-touch-icon.png" = "logos/apple-touch-icon.png"

# The agent client, the T3 Code fork the dashboard frames: it draws the conversation and the
# composer, in its own variables, and its copy sets them (cmd/palette's t3codeCSS says which, and
# what it leaves). The copy sits beside the fork's theme, apps/web/src/index.css, and the fork's
# entry imports it.
#
# Its faces are the packages versions.yaml pins, as every consumer's are: the static
# @fontsource/inter and @fontsource/jetbrains-mono, in place of the @fontsource-variable/inter the
# fork comes with. The variable package's family is "Inter Variable", a name no output writes, so
# the copy beside it draws in the system's fallback; and the dashboard around the frame draws the
# static files, so the two would be one face from two files. What the variable face gives up is
# small: the conversation asks for 400, 500 and 600, which fonts/ ships, and for 700 in a
# message's bold, which the browser then draws at 600.
[[consumer]]
name = "agent client"
repo = "spin-stack/t3code"
pin = "versions.yaml"
packages = "apps/web/package.json"
[consumer.copies]
"apps/web/src/brand.css" = "dist/t3code.css"
